name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  modeling-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install modeling package (balansis==1.0.0 приходит с PyPI)
        run: pip install -e "./modeling[test]"
      - name: Run tests
        run: pytest modeling -q

  webapp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
