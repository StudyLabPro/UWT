[project]
name = "uwt-modeling"
version = "0.1.0"
description = "Computational modeling, verification and forecasting toolkit for Unified Whole Theory (UWT)."
requires-python = ">=3.10,<4.0"
license = { text = "AGPL-3.0-only" }
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "License :: Other/Proprietary License"
]
dependencies = [
  "balansis==1.0.0",
  "numpy>=1.24,<2.0",
  "pydantic>=2.5,<3.0"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8.0"]

[project.scripts]
uwt-model = "uwt_modeling.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
